<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyReplay</title>
  </head>
  <body class="flex h-full flex-col bg-night text-sm text-fg">
    <!-- The airport picker and time bar are mounted from src/components/ by main.ts. -->
    <header class="flex flex-wrap items-center gap-4 border-b border-line bg-panel px-4 py-2.5">
      <span class="text-lg tracking-wide">Sky<b class="text-neon text-shadow-neon">Replay</b></span>
      <span id="status" role="status" class="order-1 ml-auto text-[13px] text-muted"></span>
    </header>
    <div id="map" class="flex-1"></div>
    <footer class="flex flex-wrap items-center gap-4 border-t border-line bg-panel px-4 py-2.5">
      <small class="text-muted">Data: <a class="underline" href="https://adsb.lol">adsb.lol</a> (ODbL)</small>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
