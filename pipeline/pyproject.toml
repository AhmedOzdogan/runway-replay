[project]
name = "skyreplay-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["airports", "download", "filter", "process", "resample"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
