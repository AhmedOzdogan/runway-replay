name: Deploy to GitHub Pages

# Deploys on every push to main, and again after each nightly data run, so the newest day on the
# `data` branch (see data.yml) actually reaches the site: the files are copied in at build time.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed data run leaves the `data` branch untouched; nothing to redeploy.
    if: github.event.workflow_run.conclusion != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The day files live on the orphan `data` branch (see data.yml).
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - run: cp data/*.json.gz data/latest.json web/public/data/
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
