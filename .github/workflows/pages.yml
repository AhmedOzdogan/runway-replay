name: Deploy to GitHub Pages

# Runs after CI passes on main, and after each nightly data run, so the newest day on the `data`
# branch (see data.yml) reaches the site: the files are copied in at build time. Chaining it to CI
# instead of to the push itself means a commit that fails the tests never goes live.
on:
  workflow_run:
    workflows: ["CI", "Daily data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only a green run of main deploys: CI also runs on pull requests (head_branch is their own
    # branch, which a fork can call "main" too), and a failed data run has nothing new to publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The day files live on the orphan `data` branch (see data.yml).
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      # Only the newest day goes into the site: the data branch keeps every day, and the build
      # would otherwise grow by ~5 MB a night. index.json lists what else is available.
      - name: Copy the newest day into the build
        run: |
          date=$(python3 -c "import json; print(json.load(open('data/latest.json'))['date'])")
          cp data/*-"$date".json.gz data/latest.json web/public/data/
          cp data/index.json web/public/data/ 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
