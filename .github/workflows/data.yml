name: Daily data

# adsb.lol publishes day D's dump at about 03:30 UTC on D+1, so process "yesterday" after that.
# The result is force-pushed as a single commit to the orphan `data` branch: only the newest day
# is kept, so the repo doesn't grow by ~1.6 MB every night.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to process (YYYY-MM-DD), default yesterday"
        required: false

permissions:
  contents: write

concurrency:
  group: data

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      AIRPORTS: MUC LHR AMS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the day and check it's new and published
        id: day
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          date="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if git fetch --depth 1 origin data 2>/dev/null \
            && git show FETCH_HEAD:latest.json | grep -q "\"$date\""; then
            echo "$date is already on the data branch."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! gh release view "v${date//-/.}-planes-readsb-prod-0" \
            -R "adsblol/globe_history_${date:0:4}" > /dev/null; then
            echo "adsb.lol hasn't published $date yet."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.day.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.day.outputs.skip != 'true'
        name: Process the day (streams ~3.5 GB)
        working-directory: pipeline
        run: python process.py --airport $AIRPORTS --date ${{ steps.day.outputs.date }}

      - if: steps.day.outputs.skip != 'true'
        name: Add the day to the data branch
        working-directory: web/public/data
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git init -b data
          git remote add origin "$remote"
          # Start from what the branch already holds: a shallow fetch, then a mixed reset, which
          # fills the index with the earlier days even though this runner only has today's files
          # on disk. It has to be --mixed: --soft leaves the index empty in a fresh repository, so
          # the commit would hold today's files alone and count every earlier day as deleted.
          if git fetch --depth 1 origin data; then
            git reset --mixed FETCH_HEAD
          else
            echo "No data branch yet; this commit starts it."
          fi
          git add *.json.gz latest.json
          # index.json lists every day on the branch, for the date picker and for other tools.
          # The file names come from git: this runner only has today's files on disk.
          git ls-files '*.json.gz' | python3 ../../../pipeline/write_index.py > index.json
          git add index.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Data for ${{ steps.day.outputs.date }}"
          git push origin data
