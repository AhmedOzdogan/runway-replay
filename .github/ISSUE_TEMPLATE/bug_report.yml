name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Click ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser / OS, or airport + date for pipeline bugs
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
